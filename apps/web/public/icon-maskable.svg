<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>DextUI</title>
  <!-- Full-bleed variant for maskable/launcher icons; glyph sits inside the
       80% safe zone so any platform mask shape keeps it whole. -->
  <rect width="64" height="64" fill="#0b0d10"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)">
    <circle cx="32" cy="38" r="11" fill="none" stroke="#5ccfe6" stroke-width="5"/>
    <path d="M43 15v34" fill="none" stroke="#5ccfe6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="38" r="4" fill="#6fdd8b"/>
  </g>
</svg>
