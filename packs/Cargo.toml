[workspace]
resolver = "2"
members = ["sdk-rs", "receipts", "invoice", "reconcile", "cashflow", "taxprep", "followups"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = "symbols"
